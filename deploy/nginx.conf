server {
    listen 80;
    server_name seattleshowtimes.com www.seattleshowtimes.com;

    # Static frontend
    root /var/www/seattleshowtimes/frontend;
    index index.html;

    location / {
        # Always revalidate before serving cached HTML/JS/CSS so new deploys
        # show up immediately. ETags make the revalidation a cheap 304 when
        # nothing changed.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API — proxy to FastAPI/uvicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
